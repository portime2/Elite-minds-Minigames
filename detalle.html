<!DOCTYPE html>

</head>
<body style="display: flex; flex-direction: column;">

<h1>Detalle de Módulo</h1>
<nav>

</ul>
</nav>

<div class="detalle-container">
<h2 id="tituloDetalle">Cargando...</h2>
<p id="textoDetalle">Información detallada sobre el módulo seleccionado...</p>

<script>
// Función específica para pintar la información según la tarjeta que se hizo clic
window.onload = function() {
const modulo = localStorage.getItem('moduloSeleccionado') || 'Información General';
document.getElementById('tituloDetalle').innerText = modulo;
document.getElementById('textoDetalle').innerText = `Aquí encontrarás toda la
documentación, guías de aprendizaje y recursos prácticos correspondientes al área de
${modulo} implementada en el programa de formación.`;
}
</script>
