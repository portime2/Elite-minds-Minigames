<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SENA</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="login-container">
<div class="login-box">
<h2>Iniciar Sesión</h2>
<form id="loginForm">
<div class="input-group">
<label for="usuario">Usuario</label>
<input type="text" id="usuario" required placeholder="Ingrese su usuario">
</div>
<div class="input-group">
<label for="password">Contraseña</label>
<input type="password" id="password" required placeholder="Ingrese su

contraseña">
</div>
<button type="submit" class="btn-login">Ingresar</button>
<p id="errorMsg" class="error-msg">Usuario o contraseña incorrectos</p>
</form>
</div>
</div>
<script src="script.js"></script>

</body>
</html>
